<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gamepad MIDI Studio</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 34px openFAD BAR：品牌 / 路由 / 全局状态 -->
<header class="os-bar">
  <div class="os-brand"><img class="os-mark" src="fad-logo.svg" alt="FAD" aria-hidden="true"><span class="os-brand-name">openFAD</span></div>
  <div class="os-divider" aria-hidden="true"></div>
  <div class="os-route">Gamepad MIDI Studio<span class="os-route-sep">/</span><span id="os-route-name">主控台</span></div>
  <div class="os-spacer"></div>
  <div class="os-status">
    <span class="led" id="led-gamepad"><span class="dot"></span><span class="led-txt">手柄</span></span>
    <span class="led" id="led-virtual"><span class="dot"></span><span class="led-txt">虚拟端口</span></span>
    <span class="led" id="led-midi"><span class="dot"></span><span class="led-txt">MIDI</span></span>
    <span class="chip" id="profile-label">—</span>
    <span class="chip mono" id="version-label"></span>
  </div>
</header>

<!-- 30px WORKSPACE TABS：核心工作区 -->
<nav class="work-tabs">
  <button data-page="main" class="nav-btn active">01 主控</button>
  <button data-page="play" class="nav-btn">02 演奏</button>
  <button data-page="seq" class="nav-btn">03 序列</button>
  <button data-page="mod" class="nav-btn">04 调制</button>
  <button data-page="mapper" class="nav-btn">05 映射层</button>
  <button data-page="settings" class="nav-btn">06 设置</button>
</nav>

<!-- WORKSPACE：任务表面 -->
<main id="page" class="page"></main>

<!-- 24px STATUS BAR -->
<footer class="status-bar">
  <div class="status-left">信号链路：手柄 → MIDI 引擎 → 虚拟端口</div>
  <div class="status-right">openFAD · Gamepad MIDI Studio</div>
</footer>

<div id="toast" class="toast" role="status"></div>
<div id="learn-banner" class="learn-banner hidden"><span>🎯 MIDI 学习中 — 请按下手柄按键 / 推动摇杆 / 按键盘键（20s 自动取消）</span><button class="btn small" id="learn-cancel-btn" style="margin-left:12px">取消</button></div>

<script>
/* 仅更新 OS bar 路由名（不干预 app.js 逻辑） */
document.addEventListener("click", function (e) {
  var b = e.target.closest ? e.target.closest(".nav-btn") : null;
  if (b) {
    var nameEl = document.getElementById("os-route-name");
    if (nameEl) nameEl.textContent = b.textContent.replace(/^\d+\s*/, "");
  }
});
</script>
<script src="app.js"></script>
</body>
</html>
